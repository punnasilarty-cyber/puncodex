<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — Pun Codex</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef6ef">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Urbanist:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #123a2b;
    --forest-2: #1d5540;
    --mint: #eef6ef;
    --ink: #16241d;
    --muted: #5c6f64;
    --line: rgba(18, 58, 43, .16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1200px 600px at 15% -10%, #ffffff 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #dff0e4 0%, transparent 55%),
      var(--mint);
    color: var(--ink);
    font: 400 15px/1.7 'Prompt', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(440px, 100%);
    padding: 34px 30px 28px;
    border-radius: 24px;
    background: rgba(255, 255, 255, .82);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -50px rgba(18, 58, 43, .55);
    text-align: center;
    backdrop-filter: blur(14px);
  }
  .mark {
    display: inline-grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--forest);
    color: #f3faf5;
    font: 800 15px/1 'Urbanist', sans-serif;
    letter-spacing: .02em;
  }
  h1 {
    margin: 18px 0 6px;
    font: 600 22px/1.35 'Prompt', sans-serif;
    color: var(--forest);
  }
  p {
    margin: 0 0 22px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 46px;
    border-radius: 999px;
    background: var(--forest);
    color: #f6fbf7;
    text-decoration: none;
    font: 500 14px 'Prompt', sans-serif;
    transition: background .18s ease;
  }
  .btn:hover { background: var(--forest-2); }
  .spin {
    width: 15px;
    height: 15px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 2px solid rgba(18, 58, 43, .18);
    border-top-color: var(--forest);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation-duration: .001ms !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">PC</span>
    <h1>เข้าสู่ระบบ</h1>
    <p>หน้าเข้าสู่ระบบย้ายไปอยู่ในเว็บแอปแล้ว — กำลังพาไปที่นั่น</p>
    <div class="spin" aria-hidden="true"></div>
    <a class="btn" href="./app/#/login">ไปที่หน้าเข้าสู่ระบบ</a>
    <div class="foot">Pun Codex · โรงเรียนสังขะวิทยาคม</div>
  </main>
  <script>
    // The web app owns authentication now (Google OAuth + student PIN on one
    // Supabase session). Keep old links working and pass an already-typed student
    // code straight through so the student only has to enter the PIN.
    var code = new URLSearchParams(location.search).get('code') || '';
    var target = './app/#/login' + (code ? '?code=' + encodeURIComponent(code) : '');
    location.replace(target);
  </script>
</body>
</html>
